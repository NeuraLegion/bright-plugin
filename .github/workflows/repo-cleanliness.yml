name: Repository Cleanliness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repo-cleanliness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          for file in $(find . -name "*.json" -not -path "./node_modules/*"); do
            echo "Validating $file"
            python3 -m json.tool "$file" > /dev/null || exit 1
          done

      - name: Validate YAML files
        run: |
          pip install pyyaml
          for file in $(find . -name "*.yml" -o -name "*.yaml" | grep -v node_modules); do
            echo "Validating $file"
            python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done

      - name: Validate shell scripts
        run: |
          for file in $(find . -name "*.sh" -type f); do
            echo "Checking syntax of $file"
            bash -n "$file" || exit 1
          done
